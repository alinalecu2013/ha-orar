<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="sky" cx="50%" cy="40%" r="80%">
      <stop offset="0" stop-color="#1b2a6b"/>
      <stop offset="1" stop-color="#0b1340"/>
    </radialGradient>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2c3f8f" stop-opacity="0"/>
      <stop offset=".2" stop-color="#2c3f8f" stop-opacity=".75"/>
      <stop offset=".8" stop-color="#2c3f8f" stop-opacity=".75"/>
      <stop offset="1" stop-color="#2c3f8f" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff" stop-opacity=".9"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <symbol id="star" viewBox="-10 -10 20 20">
      <polygon points="0,-10 2.9,-4 9.5,-3.1 4.7,1.5 5.9,8.1 0,5 -5.9,8.1 -4.7,1.5 -9.5,-3.1 -2.9,-4"/>
    </symbol>
    <clipPath id="bigPlanet"><circle cx="1180" cy="1110" r="300"/></clipPath>
    <clipPath id="topPlanet"><circle cx="470" cy="20" r="85"/></clipPath>
  </defs>

  <rect width="1600" height="1000" fill="url(#sky)"/>

  <!-- banda galactică -->
  <path d="M0 330 C 300 250, 600 300, 900 360 S 1400 420, 1600 340 L1600 470 C 1400 560, 1150 500, 900 480 S 300 400, 0 470 Z" fill="url(#band)" opacity=".7"/>

  <!-- puncte de praf stelar -->
  <g fill="#fff" opacity=".55">
    <circle cx="120" cy="90" r="1.6"/><circle cx="260" cy="420" r="1.2"/><circle cx="340" cy="160" r="1.8"/>
    <circle cx="610" cy="80" r="1.3"/><circle cx="720" cy="190" r="1"/><circle cx="880" cy="120" r="1.6"/>
    <circle cx="1010" cy="60" r="1.2"/><circle cx="1270" cy="210" r="1.5"/><circle cx="1400" cy="110" r="1.1"/>
    <circle cx="1520" cy="260" r="1.7"/><circle cx="1480" cy="520" r="1.2"/><circle cx="1330" cy="640" r="1.4"/>
    <circle cx="90" cy="610" r="1.3"/><circle cx="210" cy="760" r="1.6"/><circle cx="420" cy="880" r="1.1"/>
    <circle cx="640" cy="950" r="1.5"/><circle cx="820" cy="830" r="1.2"/><circle cx="980" cy="940" r="1.6"/>
    <circle cx="1560" cy="760" r="1.2"/><circle cx="40" cy="300" r="1.4"/><circle cx="1110" cy="300" r="1"/>
    <circle cx="520" cy="520" r="1"/><circle cx="760" cy="600" r="1.1"/><circle cx="1020" cy="700" r="1"/>
  </g>

  <!-- orbite punctate -->
  <g fill="none" stroke="#fff" stroke-width="2.4" stroke-dasharray="9 9" stroke-linecap="round" opacity=".55">
    <path d="M30 230 C 120 140, 240 120, 330 190"/>
    <path d="M60 520 C 10 640, 40 760, 120 820"/>
    <path d="M1180 240 C 1290 160, 1430 170, 1520 260"/>
    <path d="M1500 420 C 1590 520, 1580 660, 1490 760"/>
    <path d="M300 960 C 420 900, 560 910, 650 980"/>
    <path d="M1360 860 C 1420 800, 1500 790, 1560 830"/>
    <path d="M780 60 C 860 120, 980 120, 1060 60"/>
  </g>

  <!-- planeta portocalie (sus) -->
  <g clip-path="url(#topPlanet)">
    <circle cx="470" cy="20" r="85" fill="#f6ae3b"/>
    <path d="M380 -10 C 430 20, 500 -20, 560 10" stroke="#fdd28a" stroke-width="16" fill="none" stroke-linecap="round"/>
    <path d="M385 45 C 440 70, 500 30, 560 60" stroke="#e8902a" stroke-width="12" fill="none" stroke-linecap="round"/>
    <path d="M400 85 C 450 100, 500 80, 545 95" stroke="#fdd28a" stroke-width="10" fill="none" stroke-linecap="round"/>
  </g>

  <!-- planeta roz cu inel -->
  <g transform="translate(870 70)">
    <ellipse cx="0" cy="8" rx="105" ry="22" fill="none" stroke="#4aa8e8" stroke-width="8" transform="rotate(-6)"/>
    <circle r="62" fill="#e88ab6"/>
    <circle cx="-22" cy="-18" r="10" fill="#c96796"/><circle cx="20" cy="-30" r="7" fill="#c96796"/>
    <circle cx="26" cy="10" r="12" fill="#c96796"/><circle cx="-30" cy="22" r="8" fill="#c96796"/>
    <circle cx="2" cy="34" r="6" fill="#c96796"/>
    <path d="M-105 14 A105 22 0 0 0 105 -8" fill="none" stroke="#4aa8e8" stroke-width="8" transform="rotate(-6)"/>
  </g>

  <!-- bec (stânga sus) -->
  <g transform="translate(140 170) rotate(-28)">
    <circle r="70" fill="url(#glow)" opacity=".35"/>
    <circle r="56" fill="#f6ae3b"/>
    <path d="M-16 4 L0 -26 L16 4" fill="none" stroke="#7a3e10" stroke-width="5" stroke-linejoin="round"/>
    <rect x="-24" y="50" width="48" height="16" rx="4" fill="#1aa0a8"/>
    <rect x="-20" y="66" width="40" height="14" rx="4" fill="#138b92"/>
    <rect x="-12" y="80" width="24" height="10" rx="5" fill="#0d6c72"/>
  </g>

  <!-- tocă de absolvire -->
  <g transform="translate(1330 120) rotate(14)">
    <polygon points="-110,0 0,-50 110,0 0,50" fill="#1aa0a8"/>
    <polygon points="-60,22 60,22 60,70 0,92 -60,70" fill="#128b92"/>
    <polygon points="-110,0 0,50 110,0 0,30" fill="#0f7a80" opacity=".55"/>
    <path d="M0 0 L80 20 L80 80" stroke="#f6ae3b" stroke-width="5" fill="none"/>
    <circle cx="80" cy="86" r="9" fill="#f6ae3b"/>
  </g>

  <!-- cometă -->
  <g transform="translate(1440 430) rotate(38)">
    <path d="M-140 -20 L0 -16 L-100 0 L0 16 L-140 20 L-60 0 Z" fill="#f6ae3b" opacity=".9"/>
    <path d="M-110 -10 L0 -8 L-80 0 L0 8 L-110 10 L-40 0 Z" fill="#fdd28a"/>
    <circle r="26" fill="#a0602a"/><circle cx="-6" cy="-6" r="7" fill="#7b4419"/><circle cx="9" cy="8" r="5" fill="#7b4419"/>
  </g>

  <!-- eprubetă -->
  <g transform="translate(90 450) rotate(-30)">
    <path d="M-14 -60 L14 -60 L14 -10 L48 50 Q 52 64 38 64 L-38 64 Q -52 64 -48 50 L-14 -10 Z" fill="#cfeefd" stroke="#4aa8e8" stroke-width="5"/>
    <path d="M-34 30 L34 30 L44 52 Q 46 58 38 58 L-38 58 Q -46 58 -44 52 Z" fill="#f6ae3b"/>
    <rect x="-20" y="-72" width="40" height="14" rx="5" fill="#4aa8e8"/>
  </g>

  <!-- pensulă -->
  <g transform="translate(1500 640) rotate(20)">
    <rect x="-16" y="-120" width="32" height="110" rx="14" fill="#1aa0a8"/>
    <rect x="-20" y="-14" width="40" height="22" rx="4" fill="#e2512f"/>
    <path d="M-20 8 Q -26 60 0 84 Q 26 60 20 8 Z" fill="#f6ae3b"/>
  </g>

  <!-- rachetă -->
  <g transform="translate(120 840) rotate(-8)">
    <path d="M-26 70 Q 0 150 26 70 Z" fill="#f6ae3b"/>
    <path d="M-14 70 Q 0 120 14 70 Z" fill="#fdd28a"/>
    <path d="M0 -110 C 40 -70, 40 20, 30 70 L-30 70 C -40 20, -40 -70, 0 -110 Z" fill="#f4f6fb"/>
    <path d="M0 -110 C 22 -88, 30 -66, 33 -50 L-33 -50 C -30 -66, -22 -88, 0 -110 Z" fill="#e2512f"/>
    <path d="M-30 20 L-62 70 L-30 64 Z" fill="#e2512f"/><path d="M30 20 L62 70 L30 64 Z" fill="#e2512f"/>
    <circle cy="-12" r="20" fill="#1b2a6b" stroke="#4aa8e8" stroke-width="6"/>
  </g>

  <!-- avion de hârtie -->
  <g transform="translate(560 860)">
    <polygon points="0,0 170,30 60,40" fill="#ffffff"/>
    <polygon points="60,40 170,30 80,70" fill="#dfe7f5"/>
    <polygon points="60,40 80,70 70,52" fill="#b9c6e2"/>
  </g>

  <!-- planeta mare (jos) -->
  <g clip-path="url(#bigPlanet)">
    <circle cx="1180" cy="1110" r="300" fill="#f6ae3b"/>
    <path d="M860 870 C 1000 830, 1150 900, 1500 860" stroke="#fdd28a" stroke-width="34" fill="none"/>
    <path d="M860 950 C 1020 920, 1160 980, 1500 940" stroke="#e8902a" stroke-width="22" fill="none"/>
    <path d="M860 1010 C 1020 990, 1200 1030, 1500 1000" stroke="#fdd28a" stroke-width="18" fill="none"/>
  </g>

  <!-- ceas deșteptător -->
  <g transform="translate(1490 900)">
    <circle cx="-62" cy="-66" r="22" fill="#f6ae3b"/><circle cx="62" cy="-66" r="22" fill="#f6ae3b"/>
    <circle r="86" fill="#1aa0a8"/><circle r="68" fill="#fff"/>
    <path d="M0 0 L0 -44 M0 0 L30 18" stroke="#1b2a6b" stroke-width="7" stroke-linecap="round"/>
    <circle r="7" fill="#1aa0a8"/>
  </g>

  <!-- stele -->
  <g fill="#f6ae3b">
    <use href="#star" x="230" y="180" width="34" height="34"/>
    <use href="#star" x="60" y="330" width="22" height="22"/>
    <use href="#star" x="40" y="580" width="40" height="40"/>
    <use href="#star" x="630" y="210" width="22" height="22"/>
    <use href="#star" x="1040" y="200" width="40" height="40"/>
    <use href="#star" x="1520" y="210" width="36" height="36"/>
    <use href="#star" x="1400" y="520" width="24" height="24"/>
    <use href="#star" x="1380" y="760" width="26" height="26"/>
    <use href="#star" x="230" y="850" width="34" height="34"/>
    <use href="#star" x="500" y="870" width="38" height="38"/>
    <use href="#star" x="950" y="860" width="36" height="36"/>
    <use href="#star" x="380" y="955" width="26" height="26"/>
    <use href="#star" x="1260" y="860" width="26" height="26"/>
    <use href="#star" x="760" y="30" width="24" height="24"/>
  </g>
</svg>
